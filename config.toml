# Voxel Engine Configuration
# Delete this file to reset to defaults. CLI flags override these values.

[graphics]
width = 1280
height = 720
vsync = true
fog_distance = 256.0
shadow_enabled = true
shadow_resolution = 1024
exposure = 0.6
vignette_strength = 0.15
textures_dir = "assets/textures"
msaa_samples = 2
occlusion_culling = true  # directory of PNG texture overrides (see textures.toml)

# Water + translucency upgrade master scalars (driving chunk shader binding 5)
water_y = 62.0             # global water surface Y (world units)
wet_edge_strength = 0.5    # 0.0..1.0 cool tint on blocks near water surface
caustics_strength = 0.6    # 0.0..1.0 sun caustics on submerged terrain
leaves_sss_strength = 0.65 # 0.0..1.0 chlorophyll backlight on leaves

# Reflections (chunk shader binding 8): water SSR + sky reflection, glass
# sheen, opaque glossy tiles (snow). 0.0 disables all reflections.
reflection_strength = 0.85 # 0.0..1.0


[world]
seed = 1337
load_radius = 4
unload_radius = 6
day_length = 1200.0  # seconds per full day cycle (1200 = 20 minutes)
assets_path = "assets"  # path to data-driven block definitions (null = use builtins)

[player]
walk_speed = 4.317
sprint_speed = 5.6
jump_speed = 7.5
gravity = 26.0
mouse_sensitivity = 0.0022
fly_speed = 20.0

[keys]
debug_overlay = "F3"
wireframe = "F4"
fly = "F5"
chat = "T"
render_distance_up = "F8"
render_distance_down = "F9"
screenshot = "F2"
pause = "Escape"
developer_console = "Backquote"
telemetry_dashboard = "F1"
edit_mode = "X"
fullscreen_map = "M"


[debug]
show_overlay = false
